name: "godot-ci export"

on:
  push:
    tags:
      - "*"

env:
  GODOT_VERSION: 4.5
  PROJECT_PATH: .

jobs:
  export-desktop:
    name: Export Desktop Builds
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Export Templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable \
             ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import Project
        run: |
          cd $PROJECT_PATH
          godot --headless --verbose --import

      - name: Create Build Directories
        run: |
          mkdir -p build/windows
          mkdir -p build/linux

      - name: Export Windows Desktop
        run: |
          EXPORT_DIR="$(readlink -f build/windows)"
          cd $PROJECT_PATH
          godot --headless --verbose --export-release "Windows Desktop" "$EXPORT_DIR/blackout-reconnect.exe"

      - name: Export Linux/X11
        run: |
          EXPORT_DIR="$(readlink -f build/linux)"
          cd $PROJECT_PATH
          godot --headless --verbose --export-release "Linux" "$EXPORT_DIR/blackout-reconnect.x86_64"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: build/windows

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: build/linux

  release:
    name: Publish Release
    needs: export-desktop
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: builds

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            builds/windows/**/*
            builds/linux/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
